name: Build

# Every push builds and tests the device; a v* tag also publishes a release with it attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node test_engine.js
      - run: python3 build_amxd.py OpenBend-JI.amxd
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBend JI
          path: OpenBend-JI.amxd

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenBend JI
      - uses: softprops/action-gh-release@v2
        with:
          name: OpenBend JI ${{ github.ref_name }}
          files: OpenBend-JI.amxd
          generate_release_notes: true
